[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "parallel-rsync-git"
version = "0.1.0"
description = "Teach parallel-rsync about .gitignore — sync code to many hosts while each machine keeps its own models."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Herbert-Gao" }]
keywords = ["rsync", "git", "gitignore", "sync", "parallel", "hpc"]
dependencies = ["PyYAML>=6.0"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Archiving :: Mirroring",
    "Topic :: System :: Filesystems",
]

[project.urls]
Homepage = "https://github.com/Herbert-Gao/parallel-rsync-git"
Issues = "https://github.com/Herbert-Gao/parallel-rsync-git/issues"

[project.scripts]
parallel-rsync-git = "parallel_rsync_git:main"

[tool.setuptools]
py-modules = ["parallel_rsync_git"]
