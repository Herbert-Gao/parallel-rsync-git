name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  self-test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        shell: bash
        run: python -m pip install --upgrade pyyaml

      - name: Get rsync (best effort)
        shell: bash
        run: |
          if command -v rsync >/dev/null 2>&1; then
            echo "rsync already present: $(rsync --version | head -1)"
          elif command -v choco >/dev/null 2>&1; then
            choco install rsync -y --no-progress || echo "choco install rsync failed"
          fi
          command -v rsync && rsync --version | head -1 || echo "no rsync here"

      - name: Show environment
        shell: bash
        run: |
          python --version
          git --version
          (rsync --version | head -1) || echo "rsync not present"

      - name: Run self-test
        shell: bash
        run: bash test_parallel_rsync_git.sh

      - name: Show the plan for the example config
        shell: bash
        run: python parallel_rsync_git.py --report --lang en -c examples/sync-multi-host.yml || true
